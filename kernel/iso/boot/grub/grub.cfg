# ============================================================
# LavOS 2026 kernel — GRUB boot config
# GRUB reads this from the .iso and boots our multiboot kernel.
# "multiboot" = the classic spec our boot.asm header implements.
# Serial console lets the host see boot messages on COM1 too.
# ============================================================

set timeout=2
set default=0

serial --unit=0 --speed=115200
terminal_output serial console
terminal_input serial console

menuentry "LavOS 2026" {
    multiboot /boot/lavos.bin
}