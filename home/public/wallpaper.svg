<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9ede"/>
      <stop offset="50%" stop-color="#6ab4f0"/>
      <stop offset="100%" stop-color="#8ec8f5"/>
    </linearGradient>
    <linearGradient id="mtn-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ab8d8"/>
      <stop offset="100%" stop-color="#92c8e0"/>
    </linearGradient>
    <linearGradient id="mtn-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a9a6a"/>
      <stop offset="60%" stop-color="#4a8a5a"/>
      <stop offset="100%" stop-color="#3a7a4a"/>
    </linearGradient>
    <linearGradient id="mtn-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8a3a"/>
      <stop offset="40%" stop-color="#3a7a2a"/>
      <stop offset="100%" stop-color="#2a6a1a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5aaa3a"/>
      <stop offset="100%" stop-color="#3a8a2a"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a7a6a"/>
      <stop offset="100%" stop-color="#4a5a4a"/>
    </linearGradient>
    <radialGradient id="cloud1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f0f4f8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#dce8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#eef2f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d8e4ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ac0e8"/>
      <stop offset="50%" stop-color="#8ad0f0"/>
      <stop offset="100%" stop-color="#6ac0e8"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Distant mountains (blue-grey) -->
  <polygon points="0,600 200,420 400,500 600,380 800,450 1000,350 1200,420 1400,380 1600,440 1920,400 1920,700 0,700" fill="url(#mtn-far)" opacity="0.6"/>
  <polygon points="0,650 150,500 350,560 550,440 750,520 950,400 1150,480 1350,420 1550,500 1750,440 1920,480 1920,750 0,750" fill="url(#mtn-far)" opacity="0.5"/>

  <!-- Mid mountains with green slopes -->
  <polygon points="0,700 100,550 250,620 400,480 550,560 700,440 850,520 1000,400 1150,480 1300,380 1450,460 1600,400 1750,470 1920,420 1920,800 0,800" fill="url(#mtn-mid)" opacity="0.85"/>

  <!-- Snow caps on distant peaks -->
  <polygon points="580,380 600,380 620,390 560,390" fill="#ffffff" opacity="0.7"/>
  <polygon points="980,350 1000,350 1020,365 960,365" fill="#ffffff" opacity="0.6"/>
  <polygon points="1380,380 1400,380 1415,392 1365,392" fill="#ffffff" opacity="0.5"/>

  <!-- Main mountain (left side, large green slope) -->
  <polygon points="-100,1080 400,250 600,350 800,500 1000,650 1200,800 1920,1080 -100,1080" fill="url(#mtn-near)"/>

  <!-- Grass texture patches on main mountain -->
  <polygon points="100,900 200,700 350,600 500,500 600,550 450,700 300,850" fill="#5aaa3a" opacity="0.5"/>
  <polygon points="0,1000 150,800 300,700 400,650 500,700 350,900 150,1050" fill="#4a9a2a" opacity="0.4"/>
  <polygon points="200,1080 350,850 500,750 600,700 700,780 550,950 350,1080" fill="#5ab83a" opacity="0.35"/>

  <!-- Cliff face / rocky outcrop -->
  <polygon points="350,580 420,500 480,450 540,420 580,440 560,500 500,560 440,620 380,660" fill="url(#cliff)" opacity="0.7"/>
  <polygon points="380,560 430,500 470,470 520,445 540,460 510,510 460,560 410,600" fill="#7a8a7a" opacity="0.5"/>

  <!-- Rocky scattered patches -->
  <polygon points="180,850 210,830 230,845 200,860" fill="#6a7a5a" opacity="0.6"/>
  <polygon points="320,750 350,735 365,748 340,760" fill="#5a6a4a" opacity="0.5"/>
  <polygon points="500,680 530,665 545,678 520,690" fill="#6a7a5a" opacity="0.5"/>
  <polygon points="120,920 150,905 165,918 140,930" fill="#5a6a4a" opacity="0.4"/>

  <!-- River / stream running down the mountain -->
  <path d="M350,520 Q380,560 400,600 Q430,660 450,720 Q480,800 500,900 Q520,1000 530,1080" fill="none" stroke="url(#river)" stroke-width="8" opacity="0.6"/>
  <path d="M352,525 Q382,565 402,605 Q432,665 452,725 Q482,805 502,905" fill="none" stroke="#a0daf5" stroke-width="3" opacity="0.4"/>

  <!-- Right side mountain slopes -->
  <polygon points="1000,1080 1200,600 1400,500 1600,450 1800,500 1920,550 1920,1080" fill="#4a8a5a" opacity="0.7"/>
  <polygon points="1100,1080 1300,700 1500,600 1700,550 1920,600 1920,1080" fill="#3a7a4a" opacity="0.6"/>

  <!-- Green patches on right slopes -->
  <polygon points="1200,900 1350,750 1500,680 1600,700 1450,850 1300,950" fill="#5aaa3a" opacity="0.4"/>
  <polygon points="1400,1080 1550,850 1700,780 1800,800 1650,950 1500,1080" fill="#4a9a2a" opacity="0.35"/>

  <!-- Scattered trees/bushes on slopes -->
  <ellipse cx="280" cy="780" rx="15" ry="20" fill="#2a6a1a" opacity="0.6"/>
  <ellipse cx="320" cy="760" rx="12" ry="16" fill="#3a7a2a" opacity="0.5"/>
  <ellipse cx="400" cy="700" rx="10" ry="14" fill="#2a6a1a" opacity="0.5"/>
  <ellipse cx="180" cy="870" rx="14" ry="18" fill="#3a7a2a" opacity="0.5"/>
  <ellipse cx="1350" cy="820" rx="12" ry="16" fill="#2a6a1a" opacity="0.5"/>
  <ellipse cx="1500" cy="790" rx="10" ry="14" fill="#3a7a2a" opacity="0.4"/>
  <ellipse cx="1650" cy="850" rx="13" ry="17" fill="#2a6a1a" opacity="0.45"/>

  <!-- Foreground grass bottom -->
  <rect x="0" y="950" width="1920" height="130" fill="#3a8a2a" opacity="0.5"/>

  <!-- Clouds -->
  <!-- Big cumulus cloud right -->
  <g opacity="0.9">
    <ellipse cx="1400" cy="200" rx="180" ry="80" fill="url(#cloud1)"/>
    <ellipse cx="1350" cy="180" rx="120" ry="70" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="1450" cy="170" rx="100" ry="65" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="1380" cy="210" rx="140" ry="55" fill="#f0f4f8" opacity="0.7"/>
    <ellipse cx="1500" cy="190" rx="90" ry="50" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="1320" cy="220" rx="80" ry="40" fill="#e8f0f8" opacity="0.6"/>
  </g>

  <!-- Medium cloud center-right -->
  <g opacity="0.85">
    <ellipse cx="1600" cy="350" rx="120" ry="55" fill="url(#cloud2)"/>
    <ellipse cx="1570" cy="340" rx="90" ry="45" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="1630" cy="335" rx="70" ry="40" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="1600" cy="360" rx="100" ry="35" fill="#f0f4f8" opacity="0.6"/>
  </g>

  <!-- Small cloud upper right -->
  <g opacity="0.7">
    <ellipse cx="1750" cy="150" rx="70" ry="35" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="1730" cy="145" rx="50" ry="28" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="1770" cy="155" rx="45" ry="25" fill="#f0f4f8" opacity="0.5"/>
  </g>

  <!-- Cloud left of center -->
  <g opacity="0.75">
    <ellipse cx="800" cy="280" rx="100" ry="45" fill="url(#cloud2)"/>
    <ellipse cx="780" cy="270" rx="75" ry="38" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="830" cy="275" rx="60" ry="32" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="800" cy="290" rx="85" ry="30" fill="#f0f4f8" opacity="0.5"/>
  </g>

  <!-- Tiny scattered clouds -->
  <ellipse cx="1200" cy="120" rx="40" ry="20" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="1050" cy="180" rx="35" ry="18" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="1800" cy="280" rx="30" ry="15" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="600" cy="150" rx="25" ry="12" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="1700" cy="100" rx="30" ry="14" fill="#ffffff" opacity="0.4"/>

  <!-- Wispy cloud streaks -->
  <ellipse cx="1100" cy="250" rx="60" ry="8" fill="#ffffff" opacity="0.2" transform="rotate(-10 1100 250)"/>
  <ellipse cx="900" cy="180" rx="50" ry="6" fill="#ffffff" opacity="0.15" transform="rotate(5 900 180)"/>
  <ellipse cx="1500" cy="250" rx="55" ry="7" fill="#ffffff" opacity="0.2" transform="rotate(-8 1500 250)"/>

  <!-- Light rays / atmospheric haze -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)" opacity="0.08"/>

  <!-- Bottom grass foreground -->
  <polygon points="0,1020 100,990 200,1000 300,985 400,995 500,980 600,990 700,975 800,985 900,970 1000,980 1100,965 1200,975 1300,960 1400,970 1500,955 1600,965 1700,950 1800,960 1920,945 1920,1080 0,1080" fill="#3a8a2a" opacity="0.6"/>
  <polygon points="0,1050 150,1030 300,1040 450,1025 600,1035 750,1020 900,1030 1050,1015 1200,1025 1350,1010 1500,1020 1650,1005 1800,1015 1920,1000 1920,1080 0,1080" fill="#2a7a1a" opacity="0.5"/>
</svg>